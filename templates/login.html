<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登入 - pos_EDU SHA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center py-4" style="height: 100vh;">
    <main class="form-signin w-100 m-auto" style="max-width: 380px;">
        <div class="card shadow-sm p-4">
            <form method="POST">
                <h3 class="h3 mb-3 fw-normal text-center">🧥 管理員登入</h3>
                <p class="text-muted text-center small mb-3">POS_EDU SHA 智慧零售系統</p>
                
                {% if error %}
                <div class="alert alert-danger py-2 small" role="alert">{{ error }}</div>
                {% endif %}

                <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="username" name="username" placeholder="帳號" required>
                    <label for="username">管理員帳號 (admin)</label>
                </div>
                <div class="form-floating mb-3">
                    <input type="password" class="form-control" id="password" name="password" placeholder="密碼" required>
                    <label for="password">密碼 (admin)</label>
                </div>

                <button class="w-100 btn btn-lg btn-dark" type="submit">登入系統</button>
            </form>
        </div>
        <footer class="text-center text-muted mt-4">
            <small>&copy; 2026 pos_EDU SHA. All rights reserved.</small>
        </footer>
    </main>
</body>
</html>
